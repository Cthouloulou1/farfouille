<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topping infini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root {
  --ground:     #F3F5F4;
  --panel:      #FFFFFF;
  --field:      #E3E8E5;
  --field-line: #D2D9D5;
  --ink:        #121916;
  --ink-soft:   #56615C;
  --ink-faint:  #8B948F;
  --rule:       #DEE4E1;
  --hover:      #ECF1EE;
  --tile-face:  #FCFAF5;
  --tile-edge:  #B6AC98;
  --tile-ink:   #1C221F;
  --joker-face: #E4EDF5;
  --joker-edge: #5E7F9B;
  --mct:        #C2493D;
  --mcd:        #E08D7E;
  --lct:        #3B7DA4;
  --lcd:        #90BCD4;
  --accent:     #1E7A4D;
  --accent-bg:  #DBEFE4;
  --warn:       #B4541C;
  --warn-bg:    #FBE7D8;
  --cursor:     #121916;
  --mark:       #B5762A;
  --shadow:     rgba(18,25,22,.13);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0E1412; --panel: #151D19; --field: #17211D; --field-line: #23312B;
    --ink: #E6EDE9; --ink-soft: #90A099; --ink-faint: #5F6E68; --rule: #23312B;
    --hover: #1B2621; --tile-face: #EFEDE4; --tile-edge: #6A6455; --tile-ink: #1C221F;
    --joker-face: #C4D8E8; --joker-edge: #3D6180;
    --mct: #99392F; --mcd: #B2665A; --lct: #2E5D7C; --lcd: #4C84A2;
    --accent: #44B27A; --accent-bg: #11301F; --warn: #DE8A4E; --warn-bg: #331E10;
    --cursor: #E6EDE9; --mark: #D8A24A; --shadow: rgba(0,0,0,.45);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; height: 100vh; overflow: hidden;
  display: flex; flex-direction: column;
  background: var(--ground); color: var(--ink);
  font-family: Archivo, system-ui, sans-serif; font-size: 14px; line-height: 1.5;
}
button {
  font: inherit; font-size: 12px; color: var(--ink); background: var(--panel);
  border: 1px solid var(--rule); border-radius: 4px; padding: 5px 11px; cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h2 { margin: 0; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-faint); font-weight: 500; }
.none { color: var(--ink-faint); font-size: 12.5px; }

.bar { flex: none; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--rule); }
.wordmark { font-family: "Instrument Serif", Georgia, serif; font-size: 23px; line-height: 1; }
.wordmark em { font-style: italic; color: var(--accent); }
.chrono { display: flex; gap: 22px; }
.chrono div { display: flex; flex-direction: column; }
.chrono span { font-size: 9.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-faint); }
.chrono b { font-family: "IBM Plex Mono", monospace; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
.who { margin-left: auto; display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--ink-soft); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.dot.on { background: var(--accent); }

.rackbar { flex: none; display: flex; align-items: center; gap: 16px; padding: 9px 16px; background: var(--panel); border-bottom: 1px solid var(--rule); }
.stat { flex: none; min-width: 72px; text-align: center; border: 1px solid var(--rule); border-radius: 4px; padding: 3px 10px 4px; }
.stat span { display: block; font-size: 9.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-faint); }
.stat b { display: block; font-family: "IBM Plex Mono", monospace; font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.25; }
.tiles { flex: 1; display: flex; justify-content: center; gap: 5px; min-width: 0; }
.caramel { position: relative; flex: none; width: 38px; height: 38px; border: 1px solid var(--tile-edge); border-radius: 2px; background: var(--tile-face); color: var(--tile-ink); font-weight: 700; font-size: 21px; line-height: 36px; text-align: center; }
.caramel i { position: absolute; right: 3px; bottom: 2px; line-height: 1; font-style: normal; font-size: 9px; font-weight: 500; opacity: .6; font-family: "IBM Plex Mono", monospace; }
.caramel.joker { background: var(--joker-face); border-color: var(--joker-edge); color: var(--joker-edge); }

.main { flex: 1; display: flex; min-height: 0; }
.board { position: relative; flex: 1; min-width: 0; background: var(--field); }
canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }

.flash { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 8px 16px; border-radius: 4px; font-size: 14px; font-weight: 500; box-shadow: 0 4px 18px var(--shadow); pointer-events: none; white-space: nowrap; }
.flash[hidden] { display: none; }
.flash.bad { background: var(--warn-bg); color: var(--warn); }
.flash.ok { background: var(--panel); color: var(--ink); border: 1px solid var(--rule); }
.flash.top { background: var(--accent-bg); color: var(--accent); }

.like { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; font-size: 11.5px; line-height: 1; background: none; border: 1px solid var(--rule); border-radius: 3px; color: var(--ink-faint); cursor: pointer; }
.like:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
.like[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }
.like:disabled { opacity: .35; cursor: default; }
.like .n { font-variant-numeric: tabular-nums; }
.prow .likes { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 11.5px; margin-left: 6px; }
.banner { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 6px 8px 6px 14px; background: var(--accent-bg); color: var(--accent); border-radius: 4px; font-size: 12.5px; box-shadow: 0 4px 18px var(--shadow); }
.banner[hidden] { display: none; }
.banner button { padding: 3px 9px; font-size: 11.5px; background: var(--panel); }

.side { flex: none; width: 300px; border-left: 1px solid var(--rule); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.panel { flex: none; overflow-y: auto; max-height: 62%; }
.panel[hidden] { display: none; }
.block { padding: 11px 15px; border-bottom: 1px solid var(--rule); }
.block[hidden] { display: none; }
.head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.head h2 { flex: 1; }
.icon { padding: 3px 6px; line-height: 1; color: var(--ink-faint); background: transparent; border-color: transparent; font-family: "IBM Plex Mono", monospace; }
.icon:hover { color: var(--accent); border-color: var(--rule); }
.icon[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }

.word { font-family: "IBM Plex Mono", monospace; font-size: 16px; font-weight: 500; letter-spacing: .04em; display: flex; align-items: baseline; gap: 9px; width: 100%; text-align: left; background: transparent; border: 0; padding: 0; border-radius: 0; }
.word .pts { margin-left: auto; font-size: 17px; color: var(--accent); font-weight: 500; }
.word.none { color: var(--ink-faint); font-size: 13px; letter-spacing: 0; }
button.word { cursor: pointer; }
button.word:hover { color: var(--accent); border-color: transparent; }
.sub { font-size: 11.5px; color: var(--ink-soft); font-family: "IBM Plex Mono", monospace; }
.bad { margin-top: 5px; font-size: 11.5px; color: var(--warn); font-family: "IBM Plex Mono", monospace; }
.bad[hidden] { display: none; }

.rank { display: flex; flex-direction: column; gap: 1px; }
.prow { display: grid; grid-template-columns: 14px 1fr auto; gap: 6px; align-items: baseline; width: 100%; text-align: left; padding: 3px 4px; background: transparent; border: 0; border-radius: 3px; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink); cursor: pointer; }
.prow:hover { background: var(--hover); border-color: transparent; color: var(--ink); }
.prow.me { color: var(--accent); font-weight: 500; }
.prow .tri { color: var(--ink-faint); font-size: 10px; }
.prow .num { color: var(--ink-faint); }
.plist { padding: 2px 0 6px 14px; display: flex; flex-direction: column; gap: 1px; }
/* Cinq colonnes, largeurs fixes sauf le mot : numero, mot, score, temps, coeur.
   Le temps a de quoi tenir sur une ligne ("12 min 05" au plus large). */
.pmove { display: grid; grid-template-columns: 24px minmax(0, 1fr) 24px 58px auto; gap: 4px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 3px; padding: 1px 3px; font-family: "IBM Plex Mono", monospace; font-size: 11px; font-variant-numeric: tabular-nums; color: var(--ink-soft); cursor: pointer; }
.pmove:hover { background: var(--hover); border-color: transparent; color: var(--ink-soft); }
.pmove .n { color: var(--ink-faint); }
.pmove .w { color: var(--ink); letter-spacing: .03em; overflow: hidden; text-overflow: ellipsis; }
.pmove .s { color: var(--accent); }
.pmove .t { text-align: right; color: var(--ink-faint); white-space: nowrap; }
.pmove .s { text-align: right; }
/* Le coeur se fait discret dans une liste : il ne doit pas gonfler la ligne. */
.pmove .like { padding: 0 3px; font-size: 10px; border-color: transparent; gap: 2px; }
.pmove .like:not([aria-pressed="true"]):not(:hover) { color: var(--ink-faint); }

.sols { display: flex; flex-direction: column; }
.sol { display: grid; grid-template-columns: 1fr 74px 44px; gap: 8px; align-items: baseline; width: 100%; text-align: left; padding: 3px 15px; background: transparent; border: 0; border-bottom: 1px solid color-mix(in srgb, var(--rule) 55%, transparent); border-left: 2px solid transparent; border-radius: 0; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--ink-soft); cursor: pointer; }
.sol:hover { background: var(--hover); border-color: transparent; border-bottom-color: color-mix(in srgb, var(--rule) 55%, transparent); color: var(--ink-soft); }
.sol[aria-current="true"] { border-left-color: var(--mark); background: color-mix(in srgb, var(--mark) 12%, transparent); color: var(--ink); }
.sol .w { color: var(--ink); letter-spacing: .04em; }
.sol.best .w, .sol.best .s { font-weight: 700; color: var(--ink); }
.sol .p { text-align: right; color: var(--ink-faint); font-size: 10.5px; }
.sol .s { text-align: right; color: var(--accent); font-weight: 500; }

.inspect-head { display: flex; align-items: center; gap: 10px; padding: 10px 15px; border-bottom: 1px solid var(--rule); background: var(--accent-bg); position: sticky; top: 0; z-index: 1; }
.inspect-head b { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 500; }
.inspect-head .g { flex: 1; font-size: 11.5px; color: var(--ink-soft); font-family: "IBM Plex Mono", monospace; }

.chat { flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.chat > h2 { padding: 10px 15px 6px; }
#chat-log { flex: 1; overflow-y: auto; padding: 0 15px 8px; display: flex; flex-direction: column; gap: 5px; }
.msg { font-size: 12.5px; line-height: 1.4; word-break: break-word; }
.msg .who { font-weight: 600; color: var(--accent); margin-right: 5px; }
.msg .at { font-size: 10px; color: var(--ink-faint); margin-left: 5px; font-family: "IBM Plex Mono", monospace; }
.cellref { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 3px; background: var(--mark); color: #fff; font-family: "IBM Plex Mono", monospace; font-size: 11px; border: 0; cursor: pointer; line-height: 1.5; }
.cellref:hover { border-color: transparent; color: #fff; filter: brightness(1.1); }
.chat-in { display: flex; gap: 6px; padding: 8px 12px 12px; border-top: 1px solid var(--rule); }
.chat-in input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 6px 9px; border: 1px solid var(--rule); border-radius: 4px; background: var(--ground); color: var(--ink); }
.chat-in input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.chat-in button { flex: none; padding: 5px 9px; }

.roadmap { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--ink) 32%, transparent); }
.roadmap[hidden] { display: none; }
.roadmap > div { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; width: min(820px, 92vw); max-height: 82vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px var(--shadow); }
.roadmap header { display: flex; align-items: center; gap: 10px; padding: 13px 18px; border-bottom: 1px solid var(--rule); }
.roadmap header h3 { margin: 0; flex: 1; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 19px; }
#rm-body { overflow-y: auto; padding: 4px 0 10px; }
.rmrow { display: grid; grid-template-columns: 44px 92px 1fr 80px 46px 1fr 62px auto; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 4px 18px; background: transparent; border: 0; border-radius: 0; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--ink-soft); cursor: pointer; }
.rmrow:hover { background: var(--hover); border-color: transparent; color: var(--ink-soft); }
.rmrow .n, .rmrow .q { color: var(--ink-faint); }
.rmrow .w { color: var(--ink); font-weight: 500; letter-spacing: .04em; }
.rmrow .s { text-align: right; color: var(--accent); font-weight: 500; }
.rmrow .t { text-align: right; color: var(--ink-faint); white-space: nowrap; }
.rmrow .like { padding: 1px 5px; font-size: 10.5px; }

.join { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ground); z-index: 30; }
/* Un selecteur de classe bat l'attribut hidden : sans cette regle, masquer
   l'ecran d'accueil ne fait rien et il reste par-dessus le jeu. */
.join[hidden] { display: none; }
.join-error { color: var(--warn); background: var(--warn-bg); border-radius: 3px; padding: 6px 10px; font-size: 12.5px; }
.join-error[hidden] { display: none; }
.join form { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 26px 28px; width: min(380px, 90vw); box-shadow: 0 8px 30px var(--shadow); }
.join h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 30px; margin: 0 0 6px; }
.join h1 em { font-style: italic; color: var(--accent); }
.join p { margin: 0 0 18px; color: var(--ink-soft); font-size: 13.5px; }
.join input { width: 100%; font: inherit; padding: 9px 11px; border: 1px solid var(--rule); border-radius: 4px; background: var(--ground); color: var(--ink); margin-bottom: 12px; }
.join input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.join button { width: 100%; padding: 9px; font-size: 14px; border-color: var(--accent); color: var(--accent); }

@media (max-width: 900px) { .side { display: none; } }
</style>
</head>
<body>

<div class="join" id="join">
  <form id="joinform">
    <h1>Topping <em>infini</em></h1>
    <p>Une grille sans bord, un tirage, et le premier qui trouve le top le pose pour tout le monde.</p>
    <input id="name" maxlength="24" placeholder="Votre pseudo" autocomplete="off" autofocus>
    <div class="join-error" id="join-error" hidden></div>
    <button type="submit">Rejoindre la grille</button>
  </form>
</div>

<div class="bar">
  <div class="wordmark">Topping <em>infini</em></div>
  <div class="chrono">
    <div><span>Grille</span><b id="age">—</b></div>
    <div><span>Coup en cours</span><b id="elapsed">—</b></div>
  </div>
  <div class="who"><span class="dot" id="dot"></span><span id="conn">connexion…</span></div>
</div>

<div class="rackbar">
  <div class="stat"><span>Coup</span><b id="rb-move">—</b></div>
  <div class="tiles" id="rb-tiles"></div>
  <div class="stat"><span>Cumul</span><b id="rb-cumul">—</b></div>
</div>

<div class="main">
  <div class="board">
    <canvas id="cv"></canvas>
    <div class="flash" id="flash" hidden></div>
  </div>

  <div class="side">
    <div class="panel" id="panel-live">
      <div class="block">
        <div class="word none" id="cur-word">—</div>
        <div class="sub" id="cur-meta"></div>
        <div class="bad" id="cur-bad" hidden></div>
      </div>
      <div class="block">
        <div class="head">
          <h2>Dernier top</h2>
          <span id="last-like"></span>
        </div>
        <button class="word none" id="last-word">—</button>
        <div class="sub" id="last-meta"></div>
      </div>
      <div class="block">
        <div class="head">
          <h2>Classement</h2>
          <button id="rm-open" class="icon" title="Feuille de route" aria-label="Feuille de route">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <path d="M2.5 2.5h11v11h-11z" fill="none" stroke="currentColor" stroke-width="1.2"/>
              <path d="M5 5.5h6M5 8h6M5 10.5h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="rank" id="rank"></div>
      </div>
      <div class="block">
        <h2>Joueurs connectés</h2>
        <div id="online" class="sub">—</div>
      </div>
      <div class="block" id="reveal-wrap" hidden>
        <button id="reveal">Révéler le top</button>
      </div>
    </div>

    <div class="chat">
      <h2>Chat</h2>
      <div id="chat-log"></div>
      <div class="chat-in">
        <input id="chat-text" maxlength="400" placeholder="Message…" autocomplete="off">
        <button id="chat-cell" title="Partager la case du curseur">Case</button>
        <button id="chat-send">Envoyer</button>
      </div>
    </div>
  </div>
</div>

<div class="roadmap" id="roadmap" hidden>
  <div>
    <header>
      <h3>Feuille de route</h3>
      <button id="rm-close">Fermer</button>
    </header>
    <div id="rm-body"></div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
